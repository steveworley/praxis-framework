name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build seed package
        # The CLI + dashboard import @praxis-framework/seed via the workspace link,
        # which resolves to the package's dist/ — so it must be built first.
        run: npm run build --workspace=@praxis-framework/seed

      - name: Build inference packages
        # The dashboard imports @praxis-framework/inference (and optionally
        # @praxis-framework/inference-quantcloud and @praxis-framework/inference-kimi)
        # via workspace links. All resolve to their dist/ output, so they must be
        # built before typecheck.
        run: |
          npm run build --workspace=@praxis-framework/inference
          npm run build --workspace=@praxis-framework/inference-quantcloud
          npm run build --workspace=@praxis-framework/inference-kimi

      - name: Typecheck (all workspaces)
        run: npm run check

      - name: Tests (all workspaces)
        run: npm test

      - name: Build dashboard
        run: npm run build --workspace=praxis-dashboard

      - name: Build CLI
        run: npm run build --workspace=@praxis-framework/cli
